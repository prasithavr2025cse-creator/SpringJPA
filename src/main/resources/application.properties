# Application Configuration
spring.application.name=uam-hub
server.port=${PORT:8081}

# Database Configuration
# Default to an in-memory H2 database for local development and testing when no MySQL environment variables are configured.
# Set DB_URL/DB_USERNAME/DB_PASSWORD to override with a real MySQL instance when needed.
spring.datasource.url=${DB_URL:jdbc:h2:mem:uam_hub;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
